<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>메모</title>
<style>
:root{--bg:#fff;--side:#f5f5f7;--line:#e5e5ea;--text:#1d1d1f;--sub:#8e8e93;--icon:#5e5e63;--acc:#e3a600;--sel:#fde98f;--rowsel:#e2e2e7;--hover:#ececf0;--field:#ececf0;--pop:#fff;--capbg:#fff;--capline:#0000001c;--sw:260px;--lw:300px}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--side:#252527;--line:#38383a;--text:#f2f2f7;--sub:#8e8e93;--icon:#b0b0b5;--acc:#f5c400;--sel:#6e5a14;--rowsel:#3a3a3c;--hover:#333335;--field:#333335;--pop:#2c2c2e;--capbg:#2c2c2e;--capline:#ffffff1f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;padding:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
:root{--ease:cubic-bezier(.2,.8,.2,1)}
.ib,.f,.it,#pop button,.cap{transition:background-color .15s var(--ease),color .15s var(--ease)}
#pop{transform-origin:top left;animation:popIn .14s var(--ease)}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.f.appear,.it.appear{animation:fadeDown .22s var(--ease)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}}
#ed ul.cl li::before{transition:background-color .18s var(--ease),border-color .18s var(--ease)}
@keyframes slideFromRight{from{transform:translateX(28%);opacity:.5}}
@keyframes slideFromLeft{from{transform:translateX(-22%);opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (display-mode:window-controls-overlay){
  .bar{-webkit-app-region:drag;app-region:drag}
  .bar button,.bar input,.bar label{-webkit-app-region:no-drag;app-region:no-drag}
  body.nosb #list .bar{padding-left:calc(env(titlebar-area-x,0px) + 8px)}
}
.ib{min-width:34px;height:30px;display:inline-grid;place-items:center;border-radius:7px;color:var(--icon);padding:0 6px}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.35;background:none}
.ib.on{color:var(--acc)}
.sp{flex:1}
.cap{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 4px;border-radius:999px;background:var(--capbg);box-shadow:0 0 0 .5px var(--capline),0 2px 8px #0000000f}
.cap .ib{border-radius:999px;height:32px;min-width:36px}

#app{display:grid;grid-template-columns:var(--sw) var(--lw) 1fr;height:100vh;height:100dvh}
@media (min-width:1024px){
  body.nosb #app{grid-template-columns:var(--lw) 1fr}
  body.nosb #folders{display:none}
}
.back{grid-auto-flow:column;gap:2px;color:var(--acc)!important;padding:0 8px 0 2px}
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#folders{background:var(--side);border-right:1px solid var(--line)}
@media (min-width:1024px){#folders{margin:8px 0 8px 8px;border:0;border-radius:18px;box-shadow:0 0 0 .5px var(--capline),0 4px 18px #0000000d}}
#list{border-right:1px solid var(--line)}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;padding-top:env(safe-area-inset-top);box-sizing:content-box}
.scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.rs{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:5;touch-action:none}
.big{font-size:30px;font-weight:700;margin:0 18px 8px}

/* 사이드바 */
.f{display:flex;align-items:center;gap:6px;height:34px;margin:1px 8px;padding-right:10px;border-radius:10px;user-select:none;-webkit-user-select:none}
.f .chev{width:14px;flex:none;color:var(--sub);font-size:12px;text-align:center}
.f svg{color:var(--icon)}
.f .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.f .n{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.f.on{background:var(--acc)}
.f.on svg,.f.on .nm,.f.on .n,.f.on .chev{color:#fff!important}
.f.drop-in{background:var(--sel)}
.f.drop-before{box-shadow:inset 0 2px 0 var(--acc)}
.f.drop-after{box-shadow:inset 0 -2px 0 var(--acc)}
.slabel{font-size:12px;font-weight:600;color:var(--sub);padding:12px 18px 4px}
.foot{display:flex;align-items:center;gap:8px;padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));font-size:12px;color:var(--sub)}
.foot button{color:var(--sub)}

/* 메모 목록 */
.lhead{flex:1;min-width:0;padding-left:6px;line-height:1.25}
.lhead b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead small{color:var(--sub);font-size:12px}
.search{display:flex;align-items:center;gap:6px;background:var(--field);border-radius:10px;padding:0 9px;height:30px;color:var(--sub)}
.search.cap{background:var(--capbg);height:38px;padding:0 14px}
.search svg{width:16px;height:16px}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--text);width:100%;min-width:0}
#lsearch{margin:0 14px 8px;height:36px}
.grp{font-size:19px;font-weight:700;padding:20px 22px 6px}
.pinhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;padding:12px 22px 6px;user-select:none}
.pinhead span{color:var(--sub)}
.it{margin:0 10px;padding:10px 14px;border-radius:12px;position:relative;user-select:none;-webkit-user-select:none}
.it::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;background:var(--line)}
.it.on{background:var(--rowsel)}
body[data-focus=list] .it.on{background:var(--sel)}
.it.on::after,.it:has(+.it.on)::after,.it:last-child::after,.it:has(+.grp)::after,.it:has(+.pinhead)::after{display:none}
.it b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .l2{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.it .l2 i{font-style:normal;color:var(--text);opacity:.85;margin-right:7px}
.it .l3{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);margin-top:2px}
.it .l3 svg{width:13px;height:13px}
mark{background:#ffd60a80;color:inherit;border-radius:2px}
.none{color:var(--sub);text-align:center;padding:40px 0}

/* 편집기 */
#edbar{gap:8px;padding:0 14px}
#tools{display:flex;gap:8px}
#edsearch{width:220px}
#edwrap{flex:1;overflow-y:auto}
#eddate{text-align:center;color:var(--sub);font-size:12px;padding:14px 0 2px}
#nlist:focus,#flist:focus{outline:0}
#ed{padding:6px 40px 45vh;outline:0;font-size:calc(15.5px * var(--zoom,1));line-height:1.55;word-wrap:break-word;caret-color:var(--acc)}
#ed h1{font-size:1.74em;font-weight:700;line-height:1.25;margin:0 0 4px}
#ed h2{font-size:1.35em;font-weight:700;margin:10px 0 2px}
#ed h3{font-size:1.1em;font-weight:600;margin:8px 0 2px}
#ed pre{font:.9em/1.5 ui-monospace,Menlo,monospace;background:var(--field);padding:8px 10px;border-radius:6px;white-space:pre-wrap}
#ed ul,#ed ol{padding-left:26px;margin:2px 0}
#ed ul.cl{list-style:none;padding-left:2px}
#ed ul.cl li{position:relative;padding-left:30px;margin:5px 0;min-height:22px}
#ed ul.cl li::before{content:"";position:absolute;left:0;top:2px;width:19px;height:19px;border:1.5px solid #b4b4b9;border-radius:50%;box-sizing:border-box}
#ed ul.cl li.done::before{background:var(--acc);border-color:var(--acc);content:"✓";color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:17px}
#ed ul.dash{list-style:none;padding-left:18px}
#ed ul.dash>li::before{content:"–";position:absolute;margin-left:-16px}
#ed table{border-collapse:collapse;margin:8px 0}
#ed td{border:1px solid var(--line);padding:6px 10px;min-width:70px;vertical-align:top}
#ed a{color:var(--acc);cursor:pointer}
#ed ul ul,#ed ol ol,#ed ul ol,#ed ol ul{margin:0}
#ed ul.cl ul.cl{padding-left:26px}
#ed blockquote{margin:4px 0;padding:2px 0 2px 14px;border-left:3px solid var(--line)}
/* 섹션 접기: 제목/머리말 왼쪽 ⌄ › */
#ed :is(h1,h2,h3){position:relative}
#ed :is(h1,h2,h3)::before{content:"⌄";position:absolute;left:-22px;top:0;width:18px;text-align:center;font-size:14px;font-weight:400;color:var(--sub);opacity:0;cursor:pointer}
#ed :is(h1,h2,h3):hover::before{opacity:1}
#ed :is(h1,h2,h3).fold::before{content:"›";opacity:1}
@media (pointer:coarse){#ed :is(h1,h2,h3)::before{opacity:.45;left:-19px}}
#ed [data-fh]{display:none}
::highlight(find){background:#ffd60a55}
::highlight(findcur){background:#ffb800}
#findbar{display:flex;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#findbar input{border:0;background:var(--field);border-radius:8px;padding:6px 10px;font:inherit;color:var(--text);outline:0;width:180px}
#findbar button{padding:5px 9px;border-radius:7px;background:var(--field)}
#fcount{color:var(--sub);font-size:12px;min-width:36px}
body.nocount .f .n{visibility:hidden}
/* 태그 */
#ed .tag{color:var(--acc);font-weight:600;background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:5px;padding:0 3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--text);background:var(--bg)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* 첨부 */
#ed .att{margin:6px 0}
#ed img[data-att]{display:block;max-width:100%;max-height:520px;border-radius:10px;cursor:zoom-in;background:var(--field);min-width:80px;min-height:60px}
#ed a.file{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)!important;text-decoration:none;cursor:pointer}
.it.hasthumb{padding-right:72px}
.it .thumb{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--field)}
#lightbox{position:fixed;inset:0;z-index:60;background:#000d;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:94vw;max-height:94vh;border-radius:8px}
/* 스마트 폴더 창 */
#smartdlg{border:0;border-radius:16px;padding:0;width:min(440px,92vw);background:var(--pop);color:var(--text);box-shadow:0 20px 60px #0005}
#smartdlg::backdrop{background:#0004}
#smartdlg form{display:flex;flex-direction:column;gap:12px;padding:20px}
#smartdlg h3{margin:0;font-size:17px}
#smartdlg label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:5px}
#smartdlg input[type=text],#smartdlg select{font:inherit;color:var(--text);background:var(--field);border:0;border-radius:8px;padding:8px 10px}
#smartdlg .row{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;flex-direction:row}
#smartdlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#smartdlg .btns button{padding:8px 16px;border-radius:8px;background:var(--field)}
#smartdlg .btns .main{background:var(--acc);color:#000;font-weight:600}
#smartdlg .tagpick{display:flex;flex-wrap:wrap;gap:6px}
body.single #app{grid-template-columns:1fr!important}
body.single #folders,body.single #list,body.single .back,body.single #edsearch{display:none!important}
body:not(.single) .only-single{display:none!important}
body.single #editor{display:flex!important;grid-column:1}
@media (max-width:599px){
  body.single[data-pane=editor] #tools{position:static;border:0;padding:0;background:none;justify-content:flex-start}
  body.single #tools .cap{display:inline-flex}
  body.single #tools .ib{min-width:36px;height:32px}
  body.single #ed{padding:6px 24px 45vh}
}
@media (display-mode:window-controls-overlay){body.single #edbar{padding-left:calc(env(titlebar-area-x,0px) + 8px)}}
body.lightnote #editor{--bg:#fff;--text:#1d1d1f;--line:#e5e5ea;--field:#ececf0;--sub:#8e8e93;--capbg:#fff;background:#fff;color:#1d1d1f}
@media print{
  #folders,#list,#edbar,#findbar,#eddate,#pop,#auth{display:none!important}
  #app{display:block!important;height:auto}
  #editor{display:block!important}
  #edwrap{overflow:visible}
  #ed{padding:0}
  #ed :is(h1,h2,h3)::before{display:none}
}
#empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub)}

/* 팝업 메뉴 */
#pop{position:fixed;z-index:20;background:color-mix(in srgb,var(--pop) 86%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--capline);border-radius:14px;box-shadow:0 12px 36px #0003;padding:6px;min-width:220px;max-height:70vh;overflow-y:auto}
#pop button{display:flex;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:6px;font-size:13.5px;white-space:nowrap}
#pop button:hover:not(:disabled){background:var(--acc);color:#000}
#pop button:disabled{opacity:.4}
#pop button .ck{width:12px;flex:none}
#pop button svg{width:17px;height:17px;opacity:.8}
#pop button.ic{gap:10px;padding:7px 12px;font-size:14px}
#pop .arr{opacity:.5}
#pop .danger{color:#e5484d}
#pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#pop .lbl{font-size:11.5px;color:var(--sub);padding:4px 10px 2px}

/* 로그인 */
#auth{max-width:320px;margin:15vh auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
#auth input{padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
#auth .main{background:var(--acc);color:#000;font-weight:600;padding:11px;border-radius:9px}
#auth button{padding:8px;cursor:pointer}
#authmsg{color:var(--sub);font-size:13px;min-height:1em}

.back,.narrow,#lsearch,.big{display:none}

/* 폴드 안쪽 화면·태블릿: 목록 + 메모, 폴더는 목록 자리에 */
@media (max-width:1023px){
  #app{grid-template-columns:var(--lw) 1fr}
  #folders,#list{grid-column:1;grid-row:1}
  #editor{grid-column:2;grid-row:1}
  body[data-pane=folders] #list,body:not([data-pane=folders]) #folders{display:none}
  #list .back{display:inline-grid}
  #sbtoggle,#sbshow,#folders .rs{display:none!important}
}
/* 폴드 바깥 화면·휴대폰: 한 화면씩 (아이폰 메모처럼) */
@media (max-width:599px){
  #app,body.nosb #app{grid-template-columns:1fr}
  .pane{display:none!important;border:0}
  body[data-pane=folders] #folders,body[data-pane=list] #list,body[data-pane=editor] #editor{display:flex!important}
  .rs,#edsearch{display:none}
  .back,.narrow{display:inline-grid}
  .big{display:block}
  .slabel{display:none}
  #lsearch{display:flex}
  #folders{background:var(--bg)}
  .f{height:46px}
  .f .nm{font-size:16px}
  .f{padding-right:0}
  .f .chev{order:3;width:40px;align-self:stretch;display:grid;place-items:center;font-size:20px;color:var(--acc)}
  .it{padding:12px 14px}
  .it b{font-size:16px}
  .it .l2{font-size:14px}
  #ed{padding:6px 20px 45vh;font-size:16.5px}
  body[data-pane=editor] #tools{position:fixed;left:0;right:0;bottom:0;z-index:4;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 10px max(6px,env(safe-area-inset-bottom))}
  #tools .ib{min-width:48px;height:40px}
  /* 폰: 들어갈 땐 오른쪽에서, 나올 땐 왼쪽에서 밀려 들어옴 */
  body.fwd .pane{animation:slideFromRight .3s var(--ease)}
  body.bwd .pane{animation:slideFromLeft .3s var(--ease)}
  #tools .cap,#list .cap{display:contents}
  .back{font-size:17px}
}
</style>
</head>
<body data-pane="list" data-focus="list">
<form id="auth" hidden>
  <h1>메모</h1>
  <input type="email" id="em" placeholder="이메일" autocomplete="username" required>
  <input type="password" id="pw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
  <button class="main">로그인</button>
  <button type="button" id="signup">새 계정 만들기</button>
  <p id="authmsg"></p>
</form>

<div id="pop" hidden></div>
<div id="lightbox" hidden><img alt=""></div>
<dialog id="smartdlg"><form method="dialog">
  <h3 id="sm-title">새로운 스마트 폴더</h3>
  <label>이름<input type="text" id="sm-name" required placeholder="예: 할 일 남은 메모"></label>
  <label>태그<span class="tagpick" id="sm-tags"></span></label>
  <label class="row"><select id="sm-tagmode"><option value="all">선택한 태그가 모두 있는 메모</option><option value="any">선택한 태그가 하나라도 있는 메모</option></select></label>
  <label>날짜<span class="row"><select id="sm-datefield"><option value="">상관없음</option><option value="updated">편집일</option><option value="created">생성일</option></select>
    <select id="sm-days"><option value="1">오늘</option><option value="7" selected>최근 7일</option><option value="30">최근 30일</option><option value="365">최근 1년</option></select></span></label>
  <label>체크리스트<select id="sm-cl"><option value="">상관없음</option><option value="any">체크리스트가 있는 메모</option><option value="unchecked">체크 안 된 항목이 남은 메모</option></select></label>
  <label class="row"><input type="checkbox" id="sm-pinned"> 고정된 메모만</label>
  <label class="row"><input type="checkbox" id="sm-att"> 첨부 파일이 있는 메모만</label>
  <div class="btns"><button value="cancel" formnovalidate>취소</button><button value="ok" class="main">확인</button></div>
</form></dialog>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.3l1.8 2h8.9A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M3 10h18"/></symbol>
  <symbol id="i-all" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h13A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><path d="M6 4.5h12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ALL = 'all', TRASH = 'trash';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const now = () => new Date().toISOString();
// 비활성 문서에서 파싱해 스크립트·이미지 로드 없이 글자만 뽑는다
const plain = html => new DOMParser().parseFromString(html.replace(/<\/?(br|div|p|h[1-6]|li|tr|pre)\b[^>]*>/gi, '\n$&'), 'text/html').body.textContent;
const lines = html => plain(html).split('\n').map(s => s.trim()).filter(Boolean);
const isEmpty = html => !lines(html).length && !/<(table|img)/i.test(html);
// 메모 1000개를 글자 칠 때마다 다시 파싱하지 않도록, 내용이 바뀐 메모만 다시 뽑는다
const textCache = new Map();
const textOf = n => {
  let c = textCache.get(n.id);
  if (!c || c.html !== n.html) textCache.set(n.id, c = { html: n.html, lines: lines(n.html) });
  return c.lines;
};
const titleOf = n => textOf(n)[0] || '새로운 메모';
const infoCache = new Map();
function infoOf(n) {
  let c = infoCache.get(n.id);
  if (c && c.html === n.html) return c;
  const tags = [...new Set([...n.html.matchAll(/<span class="tag"[^>]*>#([^<]+)<\/span>/g)].map(m => m[1].toLowerCase()))];
  const cl = n.html.includes('class="cl"');
  let unchecked = false;
  if (cl) for (const m of n.html.matchAll(/<ul class="cl">([\s\S]*?)<\/ul>/g)) if (/<li(?! class="done")[ >]/.test(m[1])) unchecked = true;
  const thumb = n.html.match(/<img[^>]*data-thumb="([^"]+)"/)?.[1] || null;
  const att = thumb !== null || /data-att="/.test(n.html);
  infoCache.set(n.id, c = { html: n.html, tags, cl, unchecked, att, thumb });
  return c;
}
const tagsOf = n => infoOf(n).tags;

const cfg = window.MEMO_CFG || {};
const db = cfg.url && supabase.createClient(cfg.url, cfg.key);

let S = { folders: load('folders', []), notes: load('notes', []), view: load('view', ALL), open: null, q: '' };
// 보기 설정 (기기마다): 정렬 기준·날짜 그룹·순서·패널 너비
let P = Object.assign({ sort: 'updated', group: true, rev: false, pinOpen: true, nosb: false, sink: true, counts: true, startStyle: 'H1', zoom: 1, lightNote: false, sw: 260, lw: 300 }, load('prefs', {}));
const savePrefs = () => store('prefs', P);
// 서버에 아직 못 올린 변경: "table:id" → {table,row,del}. 저장 성공 전엔 절대 안 지운다
const SINGLE = new URLSearchParams(location.search).get('note'); // 작은 창으로 연 메모
const MULTI = !SINGLE && matchMedia('(pointer:fine)').matches;      // 맥: 새 창 열기 가능
const QKEY = SINGLE ? 'queue:' + SINGLE : 'queue';
let queue = load(QKEY, {});
if (!SINGLE) for (const k of Object.keys(localStorage)) if (k.startsWith('queue:')) {
  for (const [id, op] of Object.entries(load(k, {}))) if (!queue[id] || (op.row.updated_at || '') > (queue[id].row.updated_at || '')) queue[id] = op;
  localStorage.removeItem(k);
}
let channel, shown = {};

// 폴더 트리. 순서는 position(끌어서 바꾼 순서) → 이름. 부모가 사라진 폴더는 맨 위로
let closed = new Set(load('closed', []));
const byName = (a, b) => a.name.localeCompare(b.name, 'ko', { numeric: true });
const byOrder = (a, b) => (a.position ?? 1e9) - (b.position ?? 1e9) || byName(a, b);
const parentOf = f => f.parent_id && S.folders.some(p => p.id === f.parent_id) ? f.parent_id : null;
const kids = id => S.folders.filter(f => parentOf(f) === id).sort(byOrder);
const tree = (id = null, depth = 0, all = false) =>
  kids(id).flatMap(f => [{ f, depth }, ...(all || !closed.has(f.id) ? tree(f.id, depth + 1, all) : [])]);
const subtree = id => [id, ...kids(id).flatMap(k => subtree(k.id))];
const folder = id => S.folders.find(f => f.id === id);

// 오프라인용 사본이 저장공간(약 5MB)을 넘기면 사본을 버린다 — 저장 대기열(queue) 자리를 지키기 위해
// ponytail: 메모가 수천 개로 늘면 IndexedDB로 옮길 것
const cache = () => { store('folders', S.folders); if (!store('notes', S.notes)) localStorage.removeItem('notes'); };
const note = id => S.notes.find(n => n.id === id);
const status = t => $('#status').textContent = t;

// ---------- 동기화 ----------
function put(table, row, del = false) {
  queue[table + ':' + row.id] = { table, row: del ? { id: row.id } : { ...row }, del };
  store(QKEY, queue); // 저장 대기열은 바로 (글 잃어버리지 않게)
  clearTimeout(put.c); // 오프라인 사본(메모 전체)은 1초 모아서 한 번에 — 매 글자마다 1MB 쓰면 느림
  put.c = setTimeout(cache, 1000);
  clearTimeout(put.t);
  put.t = setTimeout(flush, 400);
}

let flushing = false;
async function flush() {
  if (flushing || !db) return;
  flushing = true;
  try {
    for (const [k, op] of Object.entries(queue)) {
      const t = db.from(op.table);
      const { error } = op.del ? await t.delete().eq('id', op.row.id) : await t.upsert(op.row);
      if (error) throw error;
      if (queue[k] === op) delete queue[k]; // 그새 또 고쳤으면 새 버전은 남겨둔다
      store(QKEY, queue);
    }
  } catch (e) {
    console.warn(e);
  } finally {
    flushing = false;
  }
  const n = Object.keys(queue).length;
  status(n ? `오프라인 · 저장 대기 ${n}개` : '');
}
setInterval(() => Object.keys(queue).length && flush(), 5000);

async function selectAll(table) {
  const out = [];
  for (let from = 0; ; from += 1000) { // Supabase는 한 번에 1000행까지만 준다
    const { data, error } = await db.from(table).select('*').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}

function merge(table, rows) {
  const m = new Map(rows.map(r => [r.id, r]));
  for (const op of Object.values(queue))
    if (op.table === table) op.del ? m.delete(op.row.id) : m.set(op.row.id, op.row);
  return [...m.values()];
}

async function pull() {
  try {
    const [n, f] = await Promise.all([selectAll('notes'), selectAll('folders')]);
    S.notes = merge('notes', n);
    S.folders = merge('folders', f);
  } catch (e) {
    return status('오프라인');
  }
  const old = Date.now() - 30 * 864e5; // 최근 삭제된 항목은 30일 뒤 비움
  for (const x of S.notes.filter(x => x.deleted_at && Date.parse(x.deleted_at) < old)) dropNote(x);
  cache();
  render();
  flush();
}

function onChange(table, p) {
  const id = p.new?.id ?? p.old?.id;
  if (queue[table + ':' + id]) return; // 이 기기에서 고친 게 아직 안 올라갔으면 내 것이 이긴다
  const list = S[table];
  const mine = list.find(x => x.id === id);
  if (p.eventType !== 'DELETE' && mine && Date.parse(mine.updated_at) > Date.parse(p.new.updated_at)) return; // 늦게 도착한 옛 버전
  S[table] = list.filter(x => x.id !== id);
  if (p.eventType !== 'DELETE') S[table].push(p.new);
  cache();
  render();
}

function subscribe() {
  if (channel) db.removeChannel(channel);
  channel = db.channel('memo')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, p => onChange('notes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'folders' }, p => onChange('folders', p))
    .subscribe(s => s === 'SUBSCRIBED' && pull()); // 재연결 때마다 놓친 변경을 다시 받는다
}

// ---------- 날짜 (애플 메모와 같은 표기) ----------
const dateOf = n => P.sort === 'created' ? n.created_at || n.updated_at : n.updated_at;
function groupOf(iso) {
  const d = new Date(iso), t = new Date();
  const days = Math.round((new Date(t).setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  if (days <= 0) return '오늘';
  if (days === 1) return '어제';
  if (days < 7) return '이전 7일';
  if (days < 30) return '이전 30일';
  return d.getFullYear() === t.getFullYear() ? `${d.getMonth() + 1}월` : `${d.getFullYear()}년`;
}
function when(iso) {
  const d = new Date(iso), g = groupOf(iso);
  if (g === '오늘') return d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  if (g === '어제') return '어제';
  if (g === '이전 7일') return d.toLocaleDateString('ko-KR', { weekday: 'long' });
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
const longDate = iso => new Date(iso).toLocaleString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });

// ---------- 화면 ----------
const svg = id => `<svg><use href="#i-${id}"/></svg>`;
// 마우스에서만 끌어서 놓기 (폰에선 길게 누르면 메뉴가 떠야 하므로)
const DRAG = matchMedia('(pointer:fine)').matches ? 'draggable="true"' : '';

function visible() {
  const q = S.q.trim().toLowerCase();
  let ns = S.notes.filter(n => S.view === TRASH && !q ? n.deleted_at : !n.deleted_at);
  if (q) ns = ns.filter(n => textOf(n).join('\n').toLowerCase().includes(q)); // 검색은 모든 폴더에서
  else if (S.view.startsWith('tag:')) ns = ns.filter(n => tagsOf(n).includes(S.view.slice(4)));
  else if (folder(S.view)?.smart) ns = ns.filter(n => smartMatch(folder(S.view).smart, n));
  else if (S.view !== ALL && S.view !== TRASH) ns = ns.filter(n => n.folder_id === S.view);
  ns.sort(P.sort === 'title' ? (a, b) => titleOf(a).localeCompare(titleOf(b), 'ko', { numeric: true })
                             : (a, b) => Date.parse(dateOf(b)) - Date.parse(dateOf(a)));
  return P.rev ? ns.reverse() : ns;
}

function hl(s) {
  const e = esc(s), q = S.q.trim();
  if (!q) return e;
  return e.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
}

let tagList = [];
let justOpened = null, justMade = null; // 방금 펼친 폴더 · 방금 만든 메모 (한 번만 스르륵)
function renderFolders(live) {
  const count = new Map();
  for (const n of live) count.set(n.folder_id, (count.get(n.folder_id) || 0) + 1);
  const row = (id, name, n, depth, icon, real) => {
    const chev = real && kids(id).length ? (closed.has(id) ? '›' : '⌄') : '';
    const appear = real && justOpened && subtree(justOpened).includes(id) && id !== justOpened ? 'appear' : '';
    return `<div class="f ${S.view === id && !S.q ? 'on' : ''} ${appear}" data-f="${id}" ${real ? DRAG : ''} style="padding-left:${4 + depth * 18}px">` +
      `<span class="chev" ${chev ? `data-tw="${id}"` : ''}>${chev}</span>${svg(icon)}<span class="nm">${esc(name)}</span><span class="n">${n || ''}</span></div>`;
  };
  $('#flist').innerHTML =
    row(ALL, '모든 메모', live.length, 0, 'all') +
    '<div class="slabel">폴더</div>' +
    tree().map(({ f, depth }) => row(f.id, f.name, f.smart ? live.filter(n => smartMatch(f.smart, n)).length : count.get(f.id), depth, f.smart ? 'smart' : 'folder', true)).join('') +
    row(TRASH, '최근 삭제된 항목', S.notes.length - live.length, 0, 'trash') +
    (tagList.length ? '<div class="slabel">태그</div><div class="tags">' + tagList.map(([t, c]) =>
      `<button class="chip ${S.view === 'tag:' + t && !S.q ? 'on' : ''}" data-tag="${esc(t)}" title="메모 ${c}개">#${esc(t)}</button>`).join('') + '</div>' : '');
}

function renderList() {
  const ns = visible();
  const searching = !!S.q.trim();
  $('#ltitle').textContent = searching ? '검색 결과' : S.view === ALL ? '모든 메모' : S.view === TRASH ? '최근 삭제된 항목' : S.view.startsWith('tag:') ? '#' + S.view.slice(4) : folder(S.view)?.name;
  $('#lcount').textContent = `${ns.length}개의 메모`;
  const showFolder = searching || S.view === ALL;
  const q = S.q.trim().toLowerCase();
  const item = n => {
    const ls = textOf(n);
    const p = (q && ls.slice(1).find(l => l.toLowerCase().includes(q))) || ls[1] || '추가 텍스트 없음';
    const f = (showFolder || S.view.startsWith('tag:') || folder(S.view)?.smart) && folder(n.folder_id), th = infoOf(n).thumb;
    return `<div class="it ${n.id === S.open || sel.has(n.id) ? 'on' : ''} ${n.id === justMade ? 'appear' : ''} ${th ? 'hasthumb' : ''}" data-n="${n.id}" ${DRAG}>${th ? `<img class="thumb" data-p="${esc(th)}" ${urlFor(th) ? `src="${urlFor(th)}"` : ''} alt="">` : ''}<b>${hl(titleOf(n))}</b>` +
      `<div class="l2"><i>${when(dateOf(n))}</i>${hl(p)}</div>${f ? `<div class="l3">${svg('folder')}${esc(f.name)}</div>` : ''}</div>`;
  };
  const pinned = S.view === TRASH && !searching ? [] : ns.filter(n => n.pinned);
  const rest = ns.filter(n => !pinned.includes(n));
  let h = '';
  if (pinned.length) h += `<div class="pinhead" data-pin>고정된 메모 <span>${P.pinOpen ? '⌄' : '›'}</span></div>` + (P.pinOpen ? pinned.map(item).join('') : '');
  if (P.group && P.sort !== 'title') {
    let last;
    for (const n of rest) {
      const g = groupOf(dateOf(n));
      if (g !== last) { h += `<div class="grp">${g}</div>`; last = g; }
      h += item(n);
    }
  } else h += (pinned.length && rest.length ? '<div class="grp">메모</div>' : '') + rest.map(item).join('');
  $('#nlist').innerHTML = h || `<div class="none">${searching ? '결과 없음' : '메모 없음'}</div>`;
  hydrate($('#nlist'));
}

function render() {
  const live = S.notes.filter(n => !n.deleted_at);
  tagList = allTags();
  if (S.view !== ALL && S.view !== TRASH && !folder(S.view) && !(S.view.startsWith('tag:') && tagList.some(([t]) => 'tag:' + t === S.view))) S.view = ALL;
  document.body.classList.toggle('nosb', P.nosb);
  document.body.classList.toggle('nocount', !P.counts);
  document.body.classList.toggle('lightnote', P.lightNote);
  document.body.style.setProperty('--zoom', P.zoom);
  $('#sbshow').hidden = !P.nosb;
  renderFolders(live);
  renderList();
  justOpened = justMade = null;
  showEditor();
}

function showEditor() {
  const n = note(S.open);
  $('#edwrap').hidden = !n;
  $('#empty').hidden = !!n;
  $('#empty').textContent = sel.size > 1 ? `메모 ${sel.size}개 선택됨` : '메모 없음';
  $$('.nb').forEach(b => b.disabled = !n || !!n?.deleted_at);
  $('#more').disabled = !n;
  $$('.newn').forEach(b => b.disabled = S.view === TRASH);
  $('#backname').textContent = S.q.trim() ? '검색' : S.view === ALL ? '모든 메모' : S.view === TRASH ? '최근 삭제' : folder(S.view)?.name || '';
  if (!n) return;
  $('#eddate').textContent = longDate(n.updated_at);
  if (SINGLE) document.title = titleOf(n);
  const editable = String(!n.deleted_at);
  if ($('#ed').contentEditable !== editable) $('#ed').contentEditable = editable;
  // 다른 기기에서 바뀐 내용 반영. 이 기기에서 치는 중(저장 대기)이면 안 덮는다
  // ponytail: 같은 메모를 두 기기에서 '동시에' 치면 나중 저장이 이김(글자 단위 병합 X). 필요하면 Yjs로
  // (브라우저마다 HTML 직렬화가 달라 innerHTML 대신 마지막으로 넣은 값과 비교 → 커서 튐 방지)
  if (shown.id !== n.id || (!queue['notes:' + n.id] && shown.html !== n.html)) {
    if (shown.id !== n.id) closeFind();
    $('#ed').innerHTML = n.html; shown = { id: n.id, html: n.html };

    hydrate(ed);
  }
}

function leave() { // 빈 메모는 남기지 않는다 (애플 메모와 같음)
  const n = note(S.open);
  if (n && !n.deleted_at && isEmpty(n.html)) dropNote(n);
}

function dropNote(n) {
  S.notes = S.notes.filter(x => x !== n);
  put('notes', n, true);
  const paths = [...n.html.matchAll(/data-(?:att|thumb)="([^"]+)"/g)].map(m => m[1]).filter(p => !S.notes.some(x => x.html.includes(p)));
  if (paths.length && db) db.storage.from('attachments').remove(paths).catch(() => {});
}

function openNote(id) {
  if (id !== S.open) leave();
  S.open = id;
  sel = new Set([id]);
  anchor = cursor = id;
  render();
  goPane('editor');
}

// bump=false: 고정·폴더 이동은 수정 날짜를 바꾸지 않는다 (애플 메모와 같음)
function save(n, fields, bump = true) {
  Object.assign(n, fields, bump ? { updated_at: now() } : {});
  put('notes', n);
}

function newNote() {
  if (S.view === TRASH) return;
  setQ('');
  const t = now();
  const sm = folder(S.view)?.smart, tags = S.view.startsWith('tag:') ? [S.view.slice(4)] : sm?.tags || [];
  const fid = S.view === ALL || S.view.startsWith('tag:') || sm ? null : S.view;
  const html = `<${P.startStyle}><br></${P.startStyle}>` + (tags.length ? `<div>${tags.map(tagSpan).join(' ')}</div>` : '');
  const n = { id: crypto.randomUUID(), folder_id: fid, html, pinned: !!sm?.pinned, deleted_at: null, updated_at: t, created_at: t };
  S.notes.push(n); // 글자를 치기 전엔 서버에 안 올린다
  justMade = n.id;
  openNote(n.id);
  const ed = $('#ed');
  ed.focus();
  getSelection().collapse(ed.firstChild, 0); // 첫 줄은 제목
}

function deleteNote(n) {
  fadeOut([n.id], () => {
    if (isEmpty(n.html)) dropNote(n); else save(n, { deleted_at: now() }, false);
    if (S.open === n.id) { S.open = null; goPane('list'); }
    render();
  });
}

const ed = $('#ed');
// 접힌 섹션을 숨기는 data-fh 표시는 화면용이라 저장에서 뺀다 (접힘 자체는 제목의 class="fold"로 저장)
const edHTML = () => ed.innerHTML.replace(/ data-fh=""/g, '').replace(/(<img\b[^>]*?) src="[^"]*"/g, '$1');
// 글 칠 때 목록(메모 1000개)은 매 글자마다 다시 그리지 않고, 손을 멈춘 뒤 0.12초에 한 번
let renderSoon;
const laterRender = () => { clearTimeout(renderSoon); renderSoon = setTimeout(render, 120); };
const saveEditor = (quiet = false) => { const n = note(S.open), h = edHTML(); if (n && n.html !== h) { save(n, { html: h }); shown.html = h; if (!quiet) laterRender(); } };
const cmd = (c, v) => { document.execCommand(c, false, v); saveEditor(); };
const block = tag => cmd('formatBlock', tag);
const curList = () => getSelection().anchorNode?.parentElement?.closest('#ed ul');
// 크롬의 목록 명령은 커서를 줄 맨 앞으로 보내서, 줄 안의 글자 위치를 기억했다가 되돌린다
const lineOf = () => { const a = getSelection().anchorNode; return (a?.nodeType === 3 ? a.parentElement : a)?.closest('li,div:not(#ed),h1,h2,h3,pre'); };
function keepCaret(fn) {
  const s = getSelection(), line = lineOf();
  let off = 0;
  if (line && s.rangeCount && s.isCollapsed) { const r = document.createRange(); r.setStart(line, 0); r.setEnd(s.anchorNode, s.anchorOffset); off = r.toString().length; }
  fn();
  const now = lineOf();
  if (!line || !now || !s.isCollapsed) return;
  const w = document.createTreeWalker(now, NodeFilter.SHOW_TEXT);
  for (let t; (t = w.nextNode());) { if (off <= t.length) return s.collapse(t, off); off -= t.length; }
}
const listCmd = c => keepCaret(() => document.execCommand(c));
function list(cls) { // 글머리/대시/체크리스트 전환 (애플 메모처럼 같은 걸 다시 누르면 해제)
  let ul = curList();
  if (ul && (ul.className || '') === cls) { listCmd('insertUnorderedList'); return saveEditor(); }
  if (!ul) { listCmd('insertUnorderedList'); ul = curList(); }
  if (ul) ul.className = cls;

function tableMenu(td, x, y) {

    { label: '아래에 행 추가', act: () => tableOp('rowBelow', td) },
    { label: '왼쪽에 열 추가', act: () => tableOp('colLeft', td) },
    { label: '오른쪽에 열 추가', act: () => tableOp('colRight', td) },

    { label: '행 삭제', act: () => tableOp('delRow', td) },
    { label: '열 삭제', act: () => tableOp('delCol', td) },
    '-',
    { label: '표 방향 전환', act: () => tableOp('transpose', td) },
    { label: '텍스트로 변환', act: () => tableOp('toText', td) },

function tableOp(op, td) {
  const tr = td.parentElement, table = td.closest('table'), ci = td.cellIndex, rows = [...table.rows];
  const cell = () => { const c = document.createElement('td'); c.innerHTML = '<br>'; return c; };
  const row = n => { const r = document.createElement('tr'); for (let i = 0; i < n; i++) r.append(cell()); return r; };

  }

// 메모 안에서 찾기 · 대치 (글자를 바꾸지 않고 하이라이트만)

// ---------- 사진·파일 첨부 ----------

function newFolder(parent_id = null) {
  const name = prompt('새로운 폴더 이름');
  if (!name?.trim()) return;
  const f = { id: crypto.randomUUID(), name: name.trim(), parent_id, position: null, updated_at: now() };
  S.folders.push(f);
  placeFolder(f, parent_id, null);
  if (parent_id) { closed.delete(parent_id); store('closed', [...closed]); }
  S.view = f.id; setQ('');
  render();
  goPane('list');
}

// 형제 폴더들 사이에 끼워 넣고 순서 번호를 다시 매긴다
function placeFolder(f, parent, beforeId) {
  const sib = kids(parent).filter(x => x !== f);
  let i = beforeId ? sib.findIndex(x => x.id === beforeId) : -1;
  if (i < 0) i = sib.length;
  sib.splice(i, 0, f);
  f.parent_id = parent;
  sib.forEach((x, k) => { if (x.position !== k || x === f) { x.position = k; x.updated_at = now(); put('folders', x); } });
}

function deleteFolder(f) {
  if (f.smart) { // 스마트 폴더는 모아 보기만 하므로 메모는 그대로
    if (!confirm(`'${f.name}' 스마트 폴더를 삭제할까요? 메모는 지워지지 않아요.`)) return;
    S.folders = S.folders.filter(x => x !== f); put('folders', f, true); return render();
  }
  const ids = subtree(f.id);
  if (!confirm(`'${f.name}' 폴더${ids.length > 1 ? `와 하위 폴더 ${ids.length - 1}개` : ''}를 삭제할까요? 안의 메모는 '최근 삭제된 항목'으로 갑니다.`)) return;
  for (const n of S.notes.filter(n => ids.includes(n.folder_id) && !n.deleted_at)) save(n, { deleted_at: now() }, false);
  for (const x of S.folders.filter(x => ids.includes(x.id))) put('folders', x, true);
  S.folders = S.folders.filter(x => !ids.includes(x.id));
  render();
}

  const { data } = await db.auth.getSession();
  if (data.session) start(); else $('#auth').hidden = false;
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
